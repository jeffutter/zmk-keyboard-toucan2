CONFIG_ZMK_DISPLAY=y

# Keeps the display drawing even after ZMK goes idle (30s).  This is the single largest continuous
# power draw in this config - flip to =y to blank the screen on idle if battery life ever becomes a
# problem.  Deliberately left off for now; battery life is fine.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

CONFIG_ZMK_WPM=y
